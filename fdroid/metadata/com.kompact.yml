Name: Kompact
Summary: Compressione offline di immagini e PDF
Description: |-
  Kompact comprime immagini JPEG/PNG/WebP e documenti PDF direttamente sul
  dispositivo utilizzando Kotlin + Jetpack Compose. Non richiede servizi
  proprietari, funziona completamente offline e offre controlli precisi per
  qualità, dimensioni massime e DPI.

  - Selettore SAF con multi-selezione
  - Preset di qualità configurabili dall'utente
  - Report dettagliato per ogni file convertito
  - Supporto tema Material You chiaro/scuro

RepoType: git
Repo: https://github.com/<your-user>/Kompact.git

Builds:
