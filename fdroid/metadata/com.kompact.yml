Name: Kompact
AutoName: Kompact
Description: |-
  Kompact compresses JPEG/PNG/WebP images directly on-device using Kotlin +
  Jetpack Compose. It avoids proprietary services, works fully offline, and
  exposes fine-grained controls for quality, maximum size, and output format.

  - SAF picker with multi-selection
  - User-configurable quality presets
  - Detailed report for every processed file
  - Material You light/dark theme support
  - Roadmap items for PDFs, audio, and video once the imaging pipeline is solid
  - Official releases are published solely by the upstream maintainer to preserve a single trusted key

