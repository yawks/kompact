    versionCode: 1
    commit: v1.0.0
    gradle:
      - yes
    subdir: .
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    rm:
      - app/build/outputs/apk/debug
    srclibs: []
    timeout: 7200

