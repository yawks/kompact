Categories:
  - Multimedia
  - Graphics
License: AGPL-3.0-or-later
SourceCode: https://github.com/<your-user>/Kompact
IssueTracker: https://github.com/<your-user>/Kompact/issues
Changelog: https://github.com/<your-user>/Kompact/releases
Name: Kompact
Summary: Offline compression for images
Description: |-
  Kompact compresses JPEG/PNG/WebP images directly on-device using Kotlin +
  Jetpack Compose. It avoids proprietary services, works fully offline, and
  exposes fine-grained controls for quality, maximum size, and output format.

  - SAF picker with multi-selection
  - User-configurable quality presets
  - Detailed report for every processed file
  - Material You light/dark theme support
  - Roadmap items for PDFs, audio, and video once the imaging pipeline is solid
  - Official releases are published solely by the upstream maintainer to preserve a single trusted key

RepoType: git
Repo: https://github.com/<your-user>/Kompact.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    gradle:
      - yes
    subdir: .
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    rm:
      - app/build/outputs/apk/debug
    srclibs: []
    timeout: 7200

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
